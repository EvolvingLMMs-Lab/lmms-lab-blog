@if (post(); as post) {
  @if (post.layout === 'standard' && tocItems().length) {
    <app-table-of-contents
      [items]="tocItems()"
      [postPath]="postPath()"
      [activeHeadingId]="activeHeadingId()"
      [progress]="readingProgress()"
      [open]="tocOpen()"
      (openChange)="tocOpen.set($event)"
      (headingSelected)="onTocHeadingSelected($event)"
    />
  }

  @if (post.layout === 'standard') {
    <app-post-header
      [title]="post.title"
      [date]="post.date"
      [description]="post.description"
      [authors]="post.authors"
      [tags]="post.tags"
    />
  }

  <article
    class="post-body"
    [class.post-body-showcase]="post.layout === 'showcase'"
    #postBody
    [innerHTML]="safeHtml()"
  ></article>

  <section class="giscus-wrapper" aria-labelledby="discussion-title">
    <header class="discussion-heading">
      <div>
        <p class="discussion-kicker">Community</p>
        <h2 id="discussion-title">Discussion</h2>
      </div>
      <p class="discussion-intro">Questions, corrections, and ideas are welcome.</p>
    </header>
    <app-giscus-comments [term]="post.slug" />
  </section>

  <app-back-to-top />
} @else {
  <div class="not-found">
    <h1>Post not found</h1>
    <a [routerLink]="backPath()"
      ><i class="ph ph-arrow-left" aria-hidden="true"></i> Back to all posts</a
    >
  </div>
}
