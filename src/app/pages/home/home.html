<div class="title-block">
  <div class="title-wrapper">
    <hr class="title-rule-top" />
    <h1 class="title">LMMs-Lab Blog</h1>
    <hr class="title-rule-bottom" />
  </div>
  <p class="title-subtitle">Feeling and building multimodal intelligence.</p>
</div>

<section class="post-list" appAutoAnimate [appAutoAnimateOptions]="{ duration: 180, easing: 'ease-out' }">
  @if (posts.length === 0) {
    <div class="empty-state">
      <i class="ph ph-sparkle" aria-hidden="true"></i>
      <p>Research notes, engineering stories, and open-source updates are on the way.</p>
    </div>
  }
  @for (post of posts; track post.slug) {
    <a class="post-entry" [routerLink]="['/', post.slug]">
      <div class="post-entry-content">
        <div class="post-row">
          <span class="post-title">
            <i class="ph ph-file-text" aria-hidden="true"></i>
            <span>{{ post.title }}</span>
          </span>
          <time class="post-date" [attr.datetime]="post.date">{{ post.date }}</time>
        </div>
        <div class="post-description">{{ post.description }}</div>
      </div>
    </a>
  }
</section>
