@if (tocItems.length) {
  <app-table-of-contents
    [items]="tocItems"
    [activeHeadingId]="activeHeadingId()"
    [postPath]="'/blog/docs'"
    [progress]="readingProgress()"
    tocId="docs-toc"
    label="Documentation table of contents"
    (headingSelected)="onTocHeadingSelected($event)"
  />
}

<header class="docs-meta">
  <div class="docs-meta-actions">
    <a routerLink="/blog">
      <i class="ph ph-arrow-left" aria-hidden="true"></i>
      All posts
    </a>
  </div>
  <span>Published from <code>docs/authoring.md</code></span>
</header>

<article #docsBody class="post-body docs-body" [innerHTML]="safeHtml"></article>

<app-back-to-top />
