@if (tocItems.length) {
  <app-table-of-contents
    [items]="tocItems"
    [activeHeadingId]="activeHeadingId()"
    [open]="tocOpen()"
    tocId="docs-toc"
    label="Documentation table of contents"
    (openChange)="tocOpen.set($event)"
    (headingSelected)="onTocHeadingSelected($event)"
  />
}

<header class="docs-meta">
  <div class="docs-meta-actions">
    <a routerLink="/">
      <i class="ph ph-arrow-left" aria-hidden="true"></i>
      All posts
    </a>
    @if (tocItems.length) {
      <button
        class="docs-contents-button"
        type="button"
        (click)="toggleToc()"
        [attr.aria-expanded]="tocOpen()"
        aria-controls="docs-toc"
      >
        Contents
      </button>
    }
  </div>
  <span>Published from <code>docs/authoring.md</code></span>
</header>

<article class="post-body docs-body" [innerHTML]="safeHtml"></article>

<app-back-to-top />
