<div class="search-backdrop" (click)="onBackdropClick($event)" (keydown)="onKeydown($event)">
  <div class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <header class="search-dialog-header">
      <div>
        <p class="search-kicker">Publication index</p>
        <h2 id="search-title">Search journal</h2>
      </div>
      <button class="search-close-btn" type="button" (click)="close()" aria-label="Close search">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <label class="search-input-wrap">
      <i class="ph ph-magnifying-glass search-icon" aria-hidden="true"></i>
      <input
        #searchInput
        type="text"
        placeholder="Search titles, descriptions, and content…"
        [value]="query()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        aria-label="Search"
      />
      <kbd>ESC</kbd>
    </label>

    <div
      class="search-results"
      appAutoAnimate
      [appAutoAnimateOptions]="{ duration: 150, easing: 'ease-out' }"
    >
      @if (query() && results().length === 0) {
        <div class="search-empty">
          <span class="search-empty-mark" aria-hidden="true">00</span>
          <span>No results for “{{ query() }}”</span>
        </div>
      } @else if (!query()) {
        <div class="search-empty">
          <span class="search-empty-mark" aria-hidden="true">//</span>
          <span>Start typing to search the archive.</span>
        </div>
      } @else {
        @for (result of results(); track result.slug; let i = $index) {
          <button
            class="search-result-item"
            [class.active]="i === activeIndex()"
            (click)="goTo(result)"
            (mouseenter)="activeIndex.set(i)"
          >
            <div class="result-title">{{ result.title }}</div>
            <div class="result-meta">
              <span class="result-date">{{ result.date }}</span>
              <span class="result-match-tag">{{ matchLabel(result.matchField) }}</span>
            </div>
            <div class="result-snippet">{{ result.snippet }}</div>
          </button>
        }
      }
    </div>

    <footer class="search-hints" aria-hidden="true">
      <span><kbd>↑↓</kbd> Navigate</span>
      <span><kbd>Enter</kbd> Open</span>
      <span><kbd>Esc</kbd> Close</span>
    </footer>
  </div>
</div>
