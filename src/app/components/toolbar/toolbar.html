<div class="toolbar-nav">
  <a class="toolbar-desktop-btn" routerLink="/" aria-label="Home" title="Home">
    <i class="ph ph-house" aria-hidden="true"></i>
  </a>
  <a
    class="toolbar-desktop-btn"
    href="https://www.lmms-lab.com/"
    aria-label="LMMs-Lab website"
    title="LMMs-Lab"
    target="_blank"
    rel="noopener noreferrer"
  >
    <i class="ph ph-globe" aria-hidden="true"></i>
  </a>
</div>

<div class="toolbar">
  <div class="toolbar-desktop">
    <button (click)="searchOpen.set(true)" aria-label="Search" title="Search posts (Ctrl+K)">
      <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
    </button>
    <button (click)="print()" aria-label="Print" title="Export as PDF / Print">
      <i class="ph ph-printer" aria-hidden="true"></i>
    </button>
  </div>

  <div class="toolbar-mobile" role="toolbar" aria-label="Quick actions">
    <div class="toolbar-mobile-group">
      <a class="toolbar-mobile-btn" routerLink="/" aria-label="Home" title="Home">
        <i class="ph ph-house" aria-hidden="true"></i>
      </a>
      <a class="toolbar-mobile-btn" href="https://www.lmms-lab.com/" aria-label="LMMs-Lab website" title="LMMs-Lab" target="_blank" rel="noopener noreferrer">
        <i class="ph ph-globe" aria-hidden="true"></i>
      </a>
      @for (btn of toolbarExt.leadingButtons(); track btn.ariaLabel) {
        <button
          class="toolbar-mobile-btn"
          type="button"
          (click)="btn.action()"
          [attr.aria-label]="btn.ariaLabel"
          [attr.aria-controls]="btn.ariaControls ?? null"
          [attr.aria-expanded]="btn.isExpanded?.() ?? null"
          [title]="btn.title"
        >
          @if (btn.toggleIcon && btn.isToggled?.()) {
            <i [class]="'ph ' + btn.toggleIcon" aria-hidden="true"></i>
          } @else {
            <i [class]="'ph ' + btn.icon" aria-hidden="true"></i>
          }
        </button>
      }
    </div>

    <div class="toolbar-mobile-title">{{ toolbarExt.mobileTitle() }}</div>

    <div class="toolbar-mobile-group">
      <button
        class="toolbar-mobile-btn"
        type="button"
        (click)="searchOpen.set(true)"
        aria-label="Search"
        title="Search posts (Ctrl+K)"
      >
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
      </button>
      <button class="toolbar-mobile-btn" type="button" (click)="print()" aria-label="Print" title="Export as PDF / Print">
        <i class="ph ph-printer" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>

@if (searchOpen()) {
  <app-search-modal (closed)="searchOpen.set(false)" />
}
