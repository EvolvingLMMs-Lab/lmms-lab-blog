<header class="title-block">
  <div class="post-kicker">
    <span>LMMs-Lab</span>
    <span class="post-kicker-rule" aria-hidden="true"></span>
    <span>Field note</span>
  </div>

  <div class="title-wrapper">
    <h1 class="title" [class.title-long]="title().length > 64">{{ title() }}</h1>
  </div>

  <div class="post-meta">
    <time [attr.datetime]="date()">{{ date() }}</time>
    <span class="post-meta-rule" aria-hidden="true"></span>
    <span>Multimodal intelligence</span>
  </div>
</header>
