<footer class="footer">
  <div class="footer-grid">
    <div class="footer-brand">
      <p class="footer-label">LMMs / Journal</p>
      <p class="footer-statement">Building multimodal intelligence in the open.</p>
    </div>

    <nav class="footer-links" aria-label="Blog links">
      <p class="footer-label">Explore</p>
      <a href="/">Lab home</a>
      <a href="/about/">About</a>
      <a routerLink="/blog">All posts</a>
      <a routerLink="/blog/docs">Authoring docs</a>
      <a [href]="sourceCodeUrl" target="_blank" rel="noopener noreferrer">
        Source code
        <i class="ph ph-arrow-up-right" aria-hidden="true"></i>
      </a>
    </nav>

    <div class="footer-stack">
      <p class="footer-label">Infrastructure</p>
      <a href="https://angular.dev" target="_blank" rel="noopener noreferrer">
        <i class="ph ph-angular-logo" aria-hidden="true"></i>
        Angular
      </a>
      <a
        href="https://developers.cloudflare.com/workers/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="ph ph-cloud" aria-hidden="true"></i>
        Cloudflare Workers
      </a>
    </div>
  </div>

  <div class="footer-baseline">
    <span>LMMs-Lab Blog</span>
    <span class="footer-signal" aria-hidden="true"><i></i> Open research log</span>
  </div>
</footer>
