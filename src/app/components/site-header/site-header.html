<header class="masthead" [class.menu-open]="menuOpen()">
  <div class="masthead-inner">
    <a class="brand" routerLink="/" aria-label="LMMs-Lab home">
      <span class="brand-image" aria-hidden="true"></span>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="site-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <nav id="site-navigation" class="navigation" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/blog" routerLinkActive="active">Blog</a>
      <div class="gallery">
        <button
          type="button"
          [class.active]="galleryOpen()"
          [attr.aria-expanded]="galleryOpen()"
          aria-haspopup="true"
          (click)="toggleGallery()"
        >Gallery</button>
        @if (galleryOpen()) {
          <div class="gallery-panel">
            <a href="https://writer.lmms-lab.com" target="_blank" rel="noopener noreferrer">
              <strong>LMMs-Lab Writer</strong><small>AI-native LaTeX editor</small>
            </a>
            <a href="https://www.engram-encrypt.com/" target="_blank" rel="noopener noreferrer">
              <strong>Engram</strong><small>Secure-first AI memory layer</small>
            </a>
          </div>
        }
      </div>
      <a routerLink="/about" routerLinkActive="active">About</a>
    </nav>
  </div>
</header>
