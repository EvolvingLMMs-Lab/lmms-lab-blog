<button
  class="toc-toggle"
  [class.toc-site-shell]="shell() === 'site'"
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="tocId()"
  [attr.aria-label]="open() ? 'Close table of contents' : 'Open table of contents'"
  title="Table of Contents"
>
  @if (open()) {
    <i class="ph ph-x" aria-hidden="true"></i>
  } @else {
    <i class="ph ph-list-numbers" aria-hidden="true"></i>
  }
</button>

<aside
  class="post-toc"
  [class.toc-site-shell]="shell() === 'site'"
  [class.toc-visible]="open()"
  [id]="tocId()"
  [attr.role]="isWide() ? null : 'dialog'"
  [attr.aria-modal]="drawerOpen() ? 'true' : null"
  [attr.aria-hidden]="open() ? null : 'true'"
  [attr.aria-labelledby]="titleId()"
  [cdkTrapFocus]="drawerOpen()"
  (keydown)="onPanelKeydown($event)"
>
  <header class="toc-header">
    <span class="toc-heading" [id]="titleId()">
      <i class="ph ph-list-numbers" aria-hidden="true"></i>
      <span>{{ title() }}</span>
    </span>
    <span class="toc-percentage" aria-hidden="true">{{ progressPercent() }}%</span>
    <button
      #closeButton
      class="toc-close"
      type="button"
      (click)="close()"
      aria-label="Close table of contents"
    >
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  </header>

  <div
    class="toc-progress"
    role="progressbar"
    aria-label="Article reading progress"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="progressPercent()"
  >
    <span
      class="toc-progress-value"
      [style.transform]="'scaleX(' + normalizedProgress() + ')'"
    ></span>
  </div>

  <nav #scrollViewport class="toc-scroll" [attr.aria-label]="label()" tabindex="-1">
    <ol class="toc-list">
      @for (item of items(); track item.id) {
        <li
          class="toc-item"
          [class.level-3-root]="item.level === 3"
          [class.contains-active]="containsActiveItem(item)"
        >
          <a
            class="toc-link"
            [class.toc-sublink]="item.level === 3"
            [class.is-active]="activeHeadingId() === item.id"
            [attr.aria-current]="activeHeadingId() === item.id ? 'location' : null"
            [attr.data-toc-id]="item.id"
            [href]="hrefFor(item.id)"
            (click)="selectHeading($event, item.id)"
          >
            {{ item.text }}
          </a>

          @if (item.children.length) {
            <ol class="toc-sublist">
              @for (child of item.children; track child.id) {
                <li class="toc-subitem">
                  <a
                    class="toc-link toc-sublink"
                    [class.is-active]="activeHeadingId() === child.id"
                    [attr.aria-current]="activeHeadingId() === child.id ? 'location' : null"
                    [attr.data-toc-id]="child.id"
                    [href]="hrefFor(child.id)"
                    (click)="selectHeading($event, child.id)"
                  >
                    {{ child.text }}
                  </a>
                </li>
              }
            </ol>
          }
        </li>
      }
    </ol>
  </nav>
</aside>

<button
  class="toc-backdrop"
  [class.toc-backdrop-visible]="drawerOpen()"
  type="button"
  (click)="close()"
  aria-label="Close table of contents"
  tabindex="-1"
></button>
