<button
  class="toc-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="tocId()"
  [attr.aria-label]="open() ? 'Close table of contents' : 'Open table of contents'"
  title="Table of Contents"
>
  @if (open()) {
    <i class="ph ph-x" aria-hidden="true"></i>
  } @else {
    <i class="ph ph-list" aria-hidden="true"></i>
  }
</button>

<aside
  class="post-toc"
  [class.toc-visible]="open()"
  [id]="tocId()"
  [attr.role]="isWide() ? null : 'dialog'"
  [attr.aria-modal]="drawerOpen() ? 'true' : null"
  [attr.aria-hidden]="open() ? null : 'true'"
  [attr.aria-labelledby]="titleId()"
  [cdkTrapFocus]="drawerOpen()"
  (keydown)="onPanelKeydown($event)"
>
  <header class="toc-title" [id]="titleId()">
    <i class="ph ph-list-numbers toc-title-icon" aria-hidden="true"></i>
    <span>{{ title() }}</span>
    <button
      #closeButton
      class="toc-close"
      type="button"
      (click)="close()"
      aria-label="Close table of contents"
    >
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  </header>

  <nav #scrollViewport class="toc-scroll" [attr.aria-label]="label()" tabindex="-1">
    <div class="toc-nav">
      @for (item of items(); track item.id) {
        <a
          class="toc-link"
          [class.level-3]="item.level === 3"
          [class.is-active]="activeHeadingId() === item.id"
          [attr.aria-current]="activeHeadingId() === item.id ? 'location' : null"
          [attr.data-toc-id]="item.id"
          [href]="'#' + item.id"
          (click)="selectHeading($event, item.id)"
        >
          {{ item.text }}
        </a>
      }
    </div>
  </nav>
</aside>

<button
  class="toc-backdrop"
  [class.toc-backdrop-visible]="drawerOpen()"
  type="button"
  (click)="close()"
  aria-label="Close table of contents"
  tabindex="-1"
></button>
